[project]
name = "hirewiseai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain-core>=1.7.4",
    "langchain-google-genai>=4.4.2",
    "langgraph>=1.2.19",
    "pydantic>=2.14.2",
    "pypdf>=6.21.4",
    "python-dotenv>=1.2.4",
    "streamlit>=1.66.1",
]

[project.scripts]
hirewiseai = "hirewiseai:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
